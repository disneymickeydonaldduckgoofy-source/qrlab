<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QR Lab</title>
<meta name="description" content="QRコード読み取りツール QR Lab の入口">
<meta name="theme-color" content="#15130f">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QR Lab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="ql1-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="ql1-192.png">
<link rel="apple-touch-icon" href="ql1-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ground:#efefec;--panel:#ffffff;--ink:#15130f;--sub:#5e5a52;--rule:#dcdcd8;--accent:#ff9500;--accent-fg:#15130f}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.panel{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--rule)}
.band{background:var(--ink);color:#ffffff;display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px}
.band h1{margin:0;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:24px;letter-spacing:3px;line-height:1}
.band span{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:1px;color:#a9a59c}
.body{padding:24px 16px 20px;display:grid;gap:18px;justify-items:center;text-align:center}
.body img{width:112px;height:112px;display:block;border:1px solid var(--rule)}
.msg{margin:0;font-size:15px;line-height:1.7}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:0;font:700 16px "IBM Plex Sans JP",system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.secondary{background:var(--panel);color:var(--ink);border:1px solid var(--ink)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.steps{width:100%;margin:0;padding:0;list-style:none;border-top:1px solid var(--rule);text-align:left}
.steps li{display:grid;grid-template-columns:36px 1fr;border-bottom:1px solid var(--rule);font-size:14px;line-height:1.6}
.steps b{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:13px;border-right:1px solid var(--rule);display:flex;align-items:center;justify-content:center}
.steps span{padding:10px 12px}
.foot{border-top:1px solid var(--rule);padding:8px 16px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--sub);display:flex;justify-content:space-between}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="panel">
  <header class="band"><h1>QR LAB</h1><span>LAUNCHER</span></header>
  <div class="body">
    <img src="ql1-192.png" alt="" width="112" height="112">
    <p class="msg" id="msg">ホーム画面に追加すると、このアイコンからQR Labを開けます。</p>
    <a class="btn primary" id="open" href="https://claude.ai/artifact/NJiEkMdhozzn6JCJUAWvBz">QR Labを開く</a>
    <button class="btn secondary" id="install" type="button" hidden>ホーム画面に追加</button>
    <ol class="steps" id="steps">
      <li><b>1</b><span>右上の「︙」をタップ</span></li>
      <li><b>2</b><span>「ホーム画面に追加」または「アプリをインストール」</span></li>
      <li><b>3</b><span>「追加」「インストール」をタップ</span></li>
    </ol>
  </div>
  <footer class="foot"><span>qrlab</span><span>v1</span></footer>
</main>
<script>
(function(){
  var URL_APP = "https://claude.ai/artifact/NJiEkMdhozzn6JCJUAWvBz";
  var q = new URLSearchParams(location.search);
  var standalone = q.has("launch") ||
    (window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: minimal-ui)").matches)) ||
    window.navigator.standalone === true;
  var KEY = "qrlab-opened";
  var already = false;
  try { already = sessionStorage.getItem(KEY) === "1"; } catch (e) {}

  if (standalone) {
    document.getElementById("steps").hidden = true;
    if (!already) {
      document.getElementById("msg").textContent = "QR Labを開いています…";
      try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
      location.replace(URL_APP);
    } else {
      document.getElementById("msg").textContent = "下のボタンからQR Labを開けます。";
    }
  }

  var deferred = null, btn = document.getElementById("install");
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferred = e;
    if (!standalone) btn.hidden = false;
  });
  btn.addEventListener("click", function(){
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null; btn.hidden = true; });
  });
  window.addEventListener("appinstalled", function(){
    btn.hidden = true;
    document.getElementById("msg").textContent = "ホーム画面に追加しました。アイコンから開けます。";
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
</body>
</html>
